version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: draftweave_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
