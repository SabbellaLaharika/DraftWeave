version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: draftweave_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
